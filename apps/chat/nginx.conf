server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Long-cache the hashed assets, short-cache the HTML so users get new
  # bundles on next visit after a deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Communal stage assets — wasm glue/binary ship inside the image
  # (Dockerfile copies apps/chat/public/wasm/, populated by
  # scripts/fetch-stage-assets.sh before `docker compose build`, same as
  # apps/demo). Model weights (Qwen3-8B, this app's fixed communal
  # model — see chatModelSource.ts) are served from the SAME
  # webllm-mirror volume apps/demo already reads from, under
  # stages/qwen3-8b-q4/ — populated on the host, not shipped in the
  # image.
  location /wasm/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location /webllm/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  # MCP same-origin reverse proxy — kept for parity with the shared
  # @unstable-legion/react surface even though this app's own UI doesn't
  # attach MCP endpoints today (no legacy tool-calling panel here); the
  # proxy is a nginx-level concern, harmless to carry forward, and keeps
  # this app's origin behaving identically to apps/demo's if that ever
  # changes. See apps/demo/nginx.conf for the SSRF-guard rationale —
  # unchanged here.
  location ~ ^/mcp-proxy/(?<upstream_scheme>https?)/(?<upstream_host>[A-Za-z0-9._:-]+)(?<upstream_path>/.*)?$ {
    if ($upstream_host ~* "^(localhost|127\.|10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|169\.254\.|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.|::1|fc|fd|fe80|2001:db8)") {
      return 403;
    }

    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Methods "POST, GET, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Accept, mcp-session-id, authorization, x-requested-with" always;
      add_header Access-Control-Max-Age 3600 always;
      add_header Content-Length 0;
      add_header Content-Type "text/plain";
      return 204;
    }

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    set $upstream_pathfinal $upstream_path;
    if ($upstream_pathfinal = "") { set $upstream_pathfinal "/"; }

    proxy_pass $upstream_scheme://$upstream_host$upstream_pathfinal$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $upstream_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_ssl_server_name on;
    proxy_ssl_name $upstream_host;

    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Expose-Headers "mcp-session-id" always;
    add_header Vary "Origin" always;
  }

  # SPA fallback — a hard-reload on any route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
