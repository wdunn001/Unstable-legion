server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Long-cache the hashed assets, short-cache the HTML so users get new
  # bundles on next visit after a deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # MLC web-llm mirror — same volume the mass-zero leet container reads.
  # Files are content-addressed shards (huggingface-cli's layout); long-
  # cache them aggressively. CORS open so other apps can fetch too.
  location /webllm/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  # MCP same-origin reverse proxy. Public MCP endpoints typically don't
  # serve CORS headers, so a browser fetch from legion.codecai.net to
  # `https://example.com/mcp` fails with `Failed to fetch`. The mesh
  # rewrites those URLs through this location:
  #   `https://example.com/mcp` → `/mcp-proxy/https/example.com/mcp`
  # nginx resolves the upstream host at request time, proxies the
  # request, and adds permissive CORS on the way back out so the SPA
  # can read the response. See packages/mesh-core/src/mcp.ts
  # `proxiedMcpUrl` for the client-side rewrite that matches this regex.
  #
  # SSRF guard: requests to private / loopback / link-local hosts are
  # 403'd. Don't loosen this — the proxy would otherwise be a free
  # internal-network probe for anyone with the site URL.
  location ~ ^/mcp-proxy/(?<upstream_scheme>https?)/(?<upstream_host>[A-Za-z0-9._:-]+)(?<upstream_path>/.*)?$ {
    if ($upstream_host ~* "^(localhost|127\.|10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|169\.254\.|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.|::1|fc|fd|fe80|2001:db8)") {
      return 403;
    }

    # Preflight: respond locally so the actual proxied request isn't
    # blocked waiting on the upstream's OPTIONS handler.
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Methods "POST, GET, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Accept, mcp-session-id, authorization, x-requested-with" always;
      add_header Access-Control-Max-Age 3600 always;
      add_header Content-Length 0;
      add_header Content-Type "text/plain";
      return 204;
    }

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    # Default path "/" when the client passed no path after the host.
    set $upstream_pathfinal $upstream_path;
    if ($upstream_pathfinal = "") { set $upstream_pathfinal "/"; }

    proxy_pass $upstream_scheme://$upstream_host$upstream_pathfinal$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $upstream_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_ssl_server_name on;
    proxy_ssl_name $upstream_host;

    # Streamable-HTTP MCP can produce SSE — disable buffering so frames
    # don't pile up in nginx.
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Expose-Headers "mcp-session-id" always;
    add_header Vary "Origin" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
