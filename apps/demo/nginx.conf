server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Long-cache the hashed assets, short-cache the HTML so users get new
  # bundles on next visit after a deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # MLC web-llm mirror — same volume the mass-zero leet container reads.
  # Files are content-addressed shards (huggingface-cli's layout); long-
  # cache them aggressively. CORS open so other apps can fetch too.
  location /webllm/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
