# Deployment compose for legion.codecai.net.
#
# Sits behind the host's existing jwilder/nginx-proxy + acme-companion
# stack (the one that already serves codecai.net). Adding the
# VIRTUAL_HOST / LETSENCRYPT_HOST envs is all that's needed for
# discovery + ACME issuance.
#
# Networks: the proxy reads containers on the `nginx-proxy` external
# network. Make sure that network already exists on the host:
#   docker network ls | grep nginx-proxy
# (codec-website wires the same way.)

services:
  legion-demo:
    build:
      context: .
      dockerfile: apps/demo/Dockerfile
      # TURN config is baked into the bundle at build time. Leave all
      # blank for STUN-only behavior (works for same-LAN peers, fails
      # for cross-NAT). Flip on by setting these to point at coturn:
      #   VITE_TURN_URLS=turn:legion.codecai.net:3478
      #   VITE_TURN_USERNAME=legion
      #   VITE_TURN_CREDENTIAL=<from /storage/coturn/turnserver.conf>
      args:
        VITE_TURN_URLS: ${VITE_TURN_URLS:-}
        VITE_TURN_USERNAME: ${VITE_TURN_USERNAME:-}
        VITE_TURN_CREDENTIAL: ${VITE_TURN_CREDENTIAL:-}
        VITE_TURN_USE_DEFAULT: ${VITE_TURN_USE_DEFAULT:-}
    container_name: unstable-legion-demo
    restart: unless-stopped
    expose:
      - "80"
    environment:
      VIRTUAL_HOST: legion.codecai.net
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: legion.codecai.net
      LETSENCRYPT_EMAIL: licensing@quasarke.com
    volumes:
      # Shared MLC web-llm mirror — populated by the mass-zero scripts/mirror-webllm-models.sh
      # script. Same volume the leet container reads at
      # /usr/share/nginx/html/webllm; legion mounts it read-only so we can't
      # accidentally corrupt the mirror. Same-origin from legion.codecai.net's
      # perspective — no CORS needed.
      - /storage/mzfs/webllm-mirror:/usr/share/nginx/html/webllm:ro
    networks:
      - nginx-proxy

networks:
  nginx-proxy:
    external: true
