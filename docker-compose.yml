# Deployment compose for legion.codecai.net.
#
# Sits behind the host's existing jwilder/nginx-proxy + acme-companion
# stack (the one that already serves codecai.net). Adding the
# VIRTUAL_HOST / LETSENCRYPT_HOST envs is all that's needed for
# discovery + ACME issuance.
#
# Networks: the proxy reads containers on the `nginx-proxy` external
# network. Make sure that network already exists on the host:
#   docker network ls | grep nginx-proxy
# (codec-website wires the same way.)
#
# M6 root-swap: `legion-chat` (apps/chat) is now the ONE container behind
# legion.codecai.net / cdn.codecai.net — nginx-proxy routes by HOSTNAME,
# not path, so "chat at / and demo at /classic on the same hostname"
# can't be two separate VIRTUAL_HOST services. apps/chat/Dockerfile
# builds apps/demo too (with --base=/classic/) and apps/chat/nginx.conf
# serves it under /classic/ from the same nginx. The old `legion-demo`
# service/container is retired by this change (see README.md's deploy
# runbook for the migration note + rollback path).

services:
  legion-chat:
    build:
      context: .
      dockerfile: apps/chat/Dockerfile
      # TURN config is baked into the bundle at build time (both apps/chat
      # and the /classic apps/demo build share these — see the Dockerfile).
      # Leave all blank for STUN-only behavior (works for same-LAN peers,
      # fails for cross-NAT). Point them at your own coturn to fix that —
      # see .env.example. Read the credential from your relay's
      # turnserver.conf; never commit it.
      args:
        VITE_TURN_URLS: ${VITE_TURN_URLS:-}
        VITE_TURN_USERNAME: ${VITE_TURN_USERNAME:-}
        VITE_TURN_CREDENTIAL: ${VITE_TURN_CREDENTIAL:-}
        VITE_TURN_USE_DEFAULT: ${VITE_TURN_USE_DEFAULT:-}
        # OpenPanel analytics (self-hosted — see docs/TELEMETRY.md). Leave
        # CLIENT_ID blank to ship WITHOUT tracking (a no-op). Set it from your
        # OpenPanel project to enable RUM + failure events.
        VITE_OPENPANEL_CLIENT_ID: ${VITE_OPENPANEL_CLIENT_ID:-}
        VITE_OPENPANEL_API_URL: ${VITE_OPENPANEL_API_URL:-}
        VITE_OPENPANEL_SCRIPT_URL: ${VITE_OPENPANEL_SCRIPT_URL:-}
    container_name: unstable-legion-chat
    restart: unless-stopped
    expose:
      - "80"
    environment:
      # These target an nginx-proxy + acme-companion front. Set them in your
      # .env; nothing environment-specific is committed here.
      #
      # A second CDN alias is worth having: pointing model artifacts at a
      # dedicated hostname (immutable, content-addressed → long-cache friendly)
      # keeps them from contending with the app origin, and lets a caching
      # front or object store slot in behind that name later without touching
      # the app. Same content, same box until it isn't.
      VIRTUAL_HOST: ${LEGION_VIRTUAL_HOST:-legion.localhost}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${LEGION_LETSENCRYPT_HOST:-}
      LETSENCRYPT_EMAIL: ${LEGION_LETSENCRYPT_EMAIL:-}
    volumes:
      # The model mirror, mounted READ-ONLY so a bad deploy can't corrupt it.
      # Serves the chat app's per-layer stage shards (stages/<model-id>/) and
      # /classic's MLC model set. Same-origin with the app → no CORS needed.
      # Populate it with scripts/populate-webllm-mirror.sh.
      - ${LEGION_WEBLLM_MIRROR_DIR:-./webllm-mirror}:/usr/share/nginx/html/webllm:ro
    networks:
      - ${LEGION_PROXY_NETWORK:-nginx-proxy}

networks:
  nginx-proxy:
    external: true
