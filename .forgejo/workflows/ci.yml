name: CI

# Runs on a self-hosted forgejo-runner (label `docker` -> node:22-bookworm
# container, host docker.sock mounted). Pure `run:` steps only — the runner
# has no access to the data.forgejo.org action registry, so no `uses:`
# actions anywhere here.
#
# The Forgejo copy of this repo is a READ-ONLY PULL MIRROR of the GitHub repo,
# so this workflow file is committed on GitHub — a pull-mirror rejects direct
# pushes, and Actions run off the mirror sync.
#
# Anything environment-specific (hosts, ports, sibling repo paths) comes from
# repo variables/secrets, never from this file: the repo is public.
#
# Cross-repo dependency problem: every package in this monorepo carries a
# `file:` dependency onto a sibling repo that doesn't exist on a fresh
# runner:
#   - packages/mesh-core -> codec-local/packages/{web,web-safety,web-llm},
#     which are absolute symlinks to /mnt/h/dev/codec-local/packages/*,
#     itself a symlink to the real Codec checkout on the dev machine.
#   - packages/mesh-core, mesh-react, apps/demo -> @unstable-legion/stage-runtime
#     via file:../../../legion-stage-runtime/packages/stage-runtime.
#
# Fix: recreate the dev machine's /mnt/h/dev root in the job container and
# clone the two sibling repos into it before `npm ci`, so the existing
# relative/absolute `file:` paths resolve unchanged:
#   - Codec: public on GitHub (wdunn001/Codec) -> anonymous clone.
#   - legion-stage-runtime: private on both GitHub and this Forgejo instance.
#     Forgejo-native checkout (same instance) using a dedicated READ-ONLY
#     deploy key added to legion-stage-runtime (title "ci-cross-repo-read"),
#     whose private half is the LEGION_STAGE_RUNTIME_DEPLOY_KEY Forgejo
#     Actions secret on THIS repo. Narrower than reusing the admin
#     mirror-token — same shape as authentik's DEPLOY_SSH_KEY pattern.
#
# Scope: mesh-core + mesh-react unit suites only. apps/demo is a Vite SPA
# with a Playwright e2e/WebGPU suite and no unit tests of its own — its
# build+deploy is handled by the demo deploy pipeline, not CI.
# PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD keeps `npm ci` from fetching
# Chromium/Firefox/WebKit for @playwright/test's postinstall, since `npm ci`
# always installs the full workspace tree (including apps/demo's deps) even
# though this workflow doesn't build/test that workspace.
#
# NOT covered (follow-up — see legion-stage-runtime ROADMAP.md "C4 — CI +
# deploy"): apps/demo's Playwright e2e / WebGPU chaos suite needs a real
# GPU device, none on the .88 runner container. workflow_dispatch stub below
# documents the manual path.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: docker
    steps:
      - name: npm ci + build + test (mesh-core, mesh-react)
        env:
          REPO_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.LEGION_STAGE_RUNTIME_DEPLOY_KEY }}
          # Set these as Forgejo repo VARIABLES (Settings -> Actions ->
          # Variables). Kept out of the file because this repo is public.
          SIBLING_SSH_HOST: ${{ vars.SIBLING_GIT_SSH_HOST }}
          SIBLING_SSH_PORT: ${{ vars.SIBLING_GIT_SSH_PORT }}
          SIBLING_STAGE_RUNTIME_REPO: ${{ vars.SIBLING_STAGE_RUNTIME_REPO }}
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates openssh-client >/dev/null

          # This runner's network has an IPv6 blackhole for some external
          # pulls, and the job container doesn't inherit the host's
          # /etc/hosts pins, so onnxruntime-node's postinstall (a transitive
          # dep pulled in by
          # @codecai/web-llm's package tree — it downloads a prebuilt native
          # binary from a github.com-hosted release) hung indefinitely the
          # first two times this ran. Force IPv4-first DNS resolution for
          # every Node process in this job rather than pinning /etc/hosts.
          export NODE_OPTIONS=--dns-result-order=ipv4first

          mkdir -p /mnt/h/dev
          # Clone from THIS instance — github.server_url is set by the runner,
          # so no host is hardcoded (this file is public; the topology is not).
          CLONE_URL="${GITHUB_SERVER_URL#http://}"; CLONE_URL="${CLONE_URL#https://}"
          git clone -q "http://token:${REPO_TOKEN}@${CLONE_URL}/${GITHUB_REPOSITORY}.git" /mnt/h/dev/unstable-legion
          cd /mnt/h/dev/unstable-legion && git checkout -q "${GITHUB_SHA}"

          # Sibling 1: Codec (public on GitHub) -> the codec-local symlink target.
          # @codecai/web(-safety|-llm) package.jsons point main/module/types
          # at dist/, which isn't committed — build the three packages
          # mesh-core actually depends on before they're usable as file:
          # deps. web-llm pulls in a github: dep on a webllm fork (only
          # needed for this repo, not legion-stage-runtime's CI).
          mkdir -p "/mnt/h/dev/Project Codec"
          git clone -q --depth 1 https://github.com/wdunn001/Codec.git "/mnt/h/dev/Project Codec/Codec"
          ( cd "/mnt/h/dev/Project Codec/Codec" && \
            npm ci --no-audit --no-fund -w packages/web -w packages/web-safety -w packages/web-llm && \
            npm run build -w packages/web -w packages/web-safety -w packages/web-llm )
          ln -s "/mnt/h/dev/Project Codec/Codec" /mnt/h/dev/codec-local

          # Sibling 2: legion-stage-runtime (private, same Forgejo instance)
          # via the dedicated read-only deploy key. mesh-core, mesh-react,
          # AND legion-stage-runtime's own packages/stage-runtime all
          # depend on this sibling's file: dist output, same as the CI in
          # legion-stage-runtime itself — build it here too, not just clone
          # it. Its own `@codecai/web` file: dependency resolves straight
          # off the Codec sibling we already cloned+built above (both sit
          # under /mnt/h/dev, matching the dev machine's layout exactly).
          # Host/port come from repo variables — SIBLING_GIT_SSH_HOST and
          # SIBLING_GIT_SSH_PORT — so this public file carries no topology.
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SIBLING_SSH_PORT" -H "$SIBLING_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -p $SIBLING_SSH_PORT -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" \
            git clone -q "git@${SIBLING_SSH_HOST}:${SIBLING_STAGE_RUNTIME_REPO}.git" /mnt/h/dev/legion-stage-runtime
          ( cd /mnt/h/dev/legion-stage-runtime && npm ci --no-audit --no-fund -w packages/stage-runtime && npm run build -w packages/stage-runtime )

          cd /mnt/h/dev/unstable-legion
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm ci --no-audit --no-fund
          npm run build -w @unstable-legion/core -w @unstable-legion/react
          npm test -w @unstable-legion/core -w @unstable-legion/react

  e2e-webgpu:
    # Manual-only stub — see the header comment above for why this isn't
    # wired into the push trigger yet.
    if: github.event_name == 'workflow_dispatch'
    runs-on: docker
    steps:
      - name: Not implemented — see legion-stage-runtime ROADMAP.md C4 follow-up
        run: |
          echo "apps/demo's Playwright e2e + WebGPU chaos suite is not wired into CI."
          echo "Run it manually: cd apps/demo && npx playwright install --with-deps chromium && npm run test:e2e"
          exit 0
