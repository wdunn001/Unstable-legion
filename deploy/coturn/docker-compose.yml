# coturn — TURN relay for the Unstable Legion mesh.
#
# `network_mode: host` is mandatory: coturn needs to learn its own
# external IP from the host's NIC and advertise relay candidates from
# the host's port range. Bridge networking adds a NAT layer that
# defeats the whole point of running a TURN server.
#
# Router config (manual one-time step):
#   UDP 3478          → 192.168.1.198:3478
#   UDP 49152-49200   → 192.168.1.198:49152-49200
#
# Verify after deploy with the public reachability test:
#   turnutils_uclient -v -u legion -w <password> legion.codecai.net

services:
  coturn:
    image: coturn/coturn:4.6
    container_name: legion-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
